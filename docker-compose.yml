services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: autolavado
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

  backend:
    build: ./backend

    depends_on:
      - postgres

    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"